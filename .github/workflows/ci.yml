name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: Windows tests and audit
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies and package
        run: |
          python -m pip install pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r requirements-ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          exit $LASTEXITCODE
      - name: Verify source and installed metadata
        run: python packaging/ci/check.py
      - name: Full test suite including local Edge browser
        run: |
          python -m pytest --junitxml=test-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/ci/check.py --junit test-results.xml
          exit $LASTEXITCODE
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-ci.lock --disable-pip --no-deps
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence
          path: test-results.xml
          retention-days: 14
