name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  tests:
    name: Windows tests and audit
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies and package
        run: |
          python -m pip install pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r requirements-ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          exit $LASTEXITCODE
      - name: Verify source and installed metadata
        run: python packaging/ci/check.py
      - name: Record package version
        id: version
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Full test suite including local Edge browser
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          $report = "ChatExporter-tests-$version.xml"
          python -m pytest --junitxml="$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/ci/check.py --junit "$report"
          exit $LASTEXITCODE
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-ci.lock --disable-pip --no-deps
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ steps.version.outputs.value || 'failed' }}
          path: ChatExporter-tests-*.xml
          retention-days: 14
