name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  build:
    needs: tests
    uses: ./.github/workflows/build.yml
  draft:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release
      - name: Check tag and publish draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $report = Get-Content release/BUILD.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cne ('v' + $report.version) -or $env:SOURCE_COMMIT -cne $report.commit) {
            throw 'Tag/version/commit mismatch'
          }
          $installer = Join-Path release $report.installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $report.installer_sha256) {
            throw 'Installer checksum mismatch'
          }
          $flags = @('--draft', '--verify-tag', '--title', ('ChatExporter ' + $report.version), '--notes-file', 'release/RELEASE_NOTES.md')
          if ($report.version -match '(a|b|rc)\d+') { $flags += '--prerelease' }
          gh release create $env:RELEASE_TAG $installer release/SHA256SUMS.txt release/BUILD.json @flags
          exit $LASTEXITCODE
