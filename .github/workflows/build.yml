name: Windows installer
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
permissions:
  contents: read
jobs:
  build:
    name: Build and verify installer
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install locked dependencies and package
        run: |
          python -m pip install pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r requirements-ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/ci/check.py
          exit $LASTEXITCODE
      - name: Install verified Inno Setup
        run: ./packaging/ci/install-inno.ps1
      - name: Build and smoke test
        run: python packaging/build.py --out _build
      - name: Build Python wheel and source distribution
        run: |
          python -m build --no-isolation --outdir dist/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check --strict dist/python/*
          exit $LASTEXITCODE
      - name: Record package version
        id: version
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify release bundle
        env:
          SOURCE_COMMIT: ${{ inputs.ref || github.sha }}
        run: python packaging/ci/artifacts.py --build _build --out dist/release --python-dist dist/python --commit "$env:SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChatExporter-${{ steps.version.outputs.value }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
