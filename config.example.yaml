##      (Umgebung: CHATEXPORTER_BROWSER_WINDOW, CHATEXPORTER__PROVIDERS__CHATGPT__BROWSER__WINDOW)
#       window: offscreen
#     auth:
##      Automatische Anmeldung (E-Mail, Passwort, Einmalcode), wenn keine gueltige Sitzung besteht:
##      auto = wenn Zugangsdaten in .env/Umgebung stehen; on = immer (fehlende Daten sind ein Fehler); off = nie.
