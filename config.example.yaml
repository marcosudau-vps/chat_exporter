##      Hoechstdauer einer automatischen Anmeldung.
##      (Umgebung: CHATEXPORTER_LOGIN_TIMEOUT_SECONDS, CHATEXPORTER__PROVIDERS__CHATGPT__AUTH__LOGIN_TIMEOUT_SECONDS)
