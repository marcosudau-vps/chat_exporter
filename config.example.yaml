##      Browser bei Bedarf starten.
##      (Umgebung: CHATEXPORTER_EDGE_LAUNCH_IF_NEEDED, CHATEXPORTER__PROVIDERS__CHATGPT__BROWSER__LAUNCH_IF_NEEDED)
#       launch_if_needed: true
##      Startseite.
##      (Umgebung: CHATEXPORTER_EDGE_OPEN_URL, CHATEXPORTER__PROVIDERS__CHATGPT__BROWSER__OPEN_URL)
#       open_url: https://chatgpt.com/
##      Wartezeit auf den Browser (ms).
##      (Umgebung: CHATEXPORTER_EDGE_CONNECT_TIMEOUT_MS, CHATEXPORTER__PROVIDERS__CHATGPT__BROWSER__CONNECT_TIMEOUT_MS)
#       connect_timeout_ms: 15000
##      Bei Bedarf interaktiv anmelden.
##      (Umgebung: CHATEXPORTER_INTERACTIVE_REAUTH, CHATEXPORTER__PROVIDERS__CHATGPT__BROWSER__INTERACTIVE_REAUTH)
#       interactive_reauth: true
##      Browser nach dem Lauf offen lassen.
##      (Umgebung: CHATEXPORTER_LEAVE_BROWSER_RUNNING, CHATEXPORTER__PROVIDERS__CHATGPT__BROWSER__LEAVE_BROWSER_RUNNING)
#       leave_browser_running: true
##      Fenster eines vom ChatExporter gestarteten Browsers; sichtbar wird es nur, wenn eine Eingabe noetig ist:
##      offscreen = ausserhalb des Bildschirms (Standard); minimized = minimiert (Anmeldung langsamer);
##      visible = immer sichtbar.
